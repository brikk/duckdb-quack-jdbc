name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required for the github-release job to upload assets

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: 1.5.6
        run: |
          set -euo pipefail
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/${DUCKDB_VERSION}" >> "$GITHUB_PATH"
          CLI=$(realpath "$HOME/.duckdb/cli/${DUCKDB_VERSION}/duckdb")
          test -f "$CLI" && test -x "$CLI"
          echo "QUACK_IT_DUCKDB=$CLI" >> "$GITHUB_ENV"
          echo "DuckDB CLI: $CLI"
          "$CLI" --version

      - name: Build and run all tests
        id: tests
        run: mvn --batch-mode --no-transfer-progress -Poracle -Dquack.it.required=true verify

      - name: Require complete integration reports
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python3 scripts/check-integration-reports.py

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-and-fixture-logs
          path: |
            target/surefire-reports/
            target/quack-fixture-logs/**/*.log

  test-v2:
    name: Build & test (DuckDB 2.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install DuckDB 2.0.0 CLI
        run: |
          set -euo pipefail
          curl -fsSL 'https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz' -o "$RUNNER_TEMP/duckdb-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/duckdb-cli.tar.gz" -C "$RUNNER_TEMP"
          CLI="$RUNNER_TEMP/duckdb"
          test -x "$CLI"
          "$CLI" --version | grep -E '^v2\.0\.0[[:space:]]'
          echo "QUACK_IT_DUCKDB=$CLI" >> "$GITHUB_ENV"

      - name: Build and run 2.0 oracle tests
        id: tests
        run: mvn --batch-mode --no-transfer-progress -Poracle -Dduckdb.jdbc.version=2.0.0.0 verify

      - name: Require signed 2.0.0 integration reports
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        env:
          QUACK_IT_EXPECTED_VERSION: v2.0.0
          QUACK_IT_EXPECTED_QUACK: f96420ed46
        run: python3 scripts/check-integration-reports.py

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-duckdb-2
          path: |
            target/surefire-reports/
            target/quack-fixture-logs/**/*.log

  snapshot:
    name: Publish verified SNAPSHOT
    needs: [test, test-v2]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17 with Central credentials
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central-snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Deploy SNAPSHOT
        env:
          MAVEN_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(mvn --batch-mode --no-transfer-progress -q -Dstyle.color=never \
            help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Not publishing a snapshot for version $VERSION"
            exit 0
          fi
          mvn --batch-mode --no-transfer-progress deploy -DskipTests

  publish:
    name: Publish to Maven Central
    needs: [test, test-v2]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 with Central credentials
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven 3.10 puts _remote.repositories and maven-metadata-local.xml in
      # Central's bundle; the 0.11.0 publisher does not remove them, so
      # validation rejects it. Keep the publishing job on the tested 3.9.16.
      - name: Install Maven 3.9.16 for Central publishing
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          curl -fsSL 'https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz' -o "$ARCHIVE"
          echo '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  '"$ARCHIVE" | sha512sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" --version

      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy -DskipTests

  github-release:
    name: Attach jars to GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package versioned + sources + javadoc jars
        run: mvn --batch-mode --no-transfer-progress -Prelease package -DskipTests

      - name: Derive version and copy un-versioned jars
        id: artifacts
        run: |
          set -euo pipefail
          VERSION=$(mvn --batch-mode --no-transfer-progress \
                       -q -Dexec.executable=echo -Dexec.args='${project.version}' \
                       --non-recursive exec:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc-${VERSION}.jar"
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc.jar"
          if [ -f "target/quack-jdbc-${VERSION}-sources.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-${VERSION}-sources.jar"
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-sources.jar"
          fi
          if [ -f "target/quack-jdbc-${VERSION}-javadoc.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-${VERSION}-javadoc.jar"
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-javadoc.jar"
          fi
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Strip the leading 'v' from the tag (refs/tags/v1.2.3 -> 1.2.3)
          # and pull the matching "## [VERSION] ..." section out of
          # CHANGELOG.md (stop at the next "## [" heading). Save to
          # release_notes.md; fall back to auto-generated notes if the
          # section is missing so the release still gets created.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version: ${VERSION}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "---- release_notes.md ----"
            cat release_notes.md
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: no matching CHANGELOG section for ${VERSION}; release will use auto-generated notes."
          fi

      - name: Create / update GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.have_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.have_notes != 'true' }}
          files: |
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}.jar
            release/quack-jdbc.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-sources.jar
            release/quack-jdbc-sources.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-javadoc.jar
            release/quack-jdbc-javadoc.jar
            release/SHA256SUMS
          fail_on_unmatched_files: false
