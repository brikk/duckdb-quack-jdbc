name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # required for the github-release job to upload assets

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: 1.5.5
        run: |
          set -euo pipefail
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/${DUCKDB_VERSION}" >> "$GITHUB_PATH"
          CLI=$(realpath "$HOME/.duckdb/cli/${DUCKDB_VERSION}/duckdb")
          test -f "$CLI" && test -x "$CLI"
          echo "QUACK_IT_DUCKDB=$CLI" >> "$GITHUB_ENV"
          echo "DuckDB CLI: $CLI"
          "$CLI" --version

      - name: Build and run all tests
        id: tests
        run: mvn --batch-mode --no-transfer-progress -Poracle -Dquack.it.required=true verify

      - name: Require complete integration reports
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        shell: python
        run: |
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          expected = set()
          for source in pathlib.Path("src/test").rglob("*.java"):
              text = source.read_text()
              if not (re.search(r'@Tag\(\s*"integration"\s*\)', text)
                      or source.stem.endswith("IntegrationTest")):
                  continue
              package = re.search(r"^package\s+([\w.]+)\s*;", text, re.MULTILINE)
              if package:
                  expected.add(package.group(1) + "." + source.stem)
          if not expected:
              raise SystemExit("No integration test classes discovered")

          allowed_skips = {
              ("com.gizmodata.quack.jdbc.transport.QuackHttpTransportTest",
               "fallsThroughToIpv6WhenIpv4HasNoListener"): "ipv6LoopbackAvailable",
              ("com.gizmodata.quack.jdbc.transport.QuackHttpTransportLimitsTest",
               "connectFailuresStillTryNextAddress"): "requires multiple localhost addresses",
          }
          seen = set()
          errors = []
          reports = sorted(pathlib.Path("target/surefire-reports").glob("TEST-*.xml"))
          for report in reports:
              root = ET.parse(report).getroot()
              for suite in root.iter("testsuite"):
                  cases = suite.findall("testcase")
                  name = suite.get("name", "")
                  if name in expected:
                      if not cases or int(suite.get("tests", "0")) == 0:
                          errors.append(f"Empty integration report: {report}")
                      else:
                          seen.add(name)
                  for case in cases:
                      classname = case.get("classname", name)
                      method = case.get("name", "").removesuffix("()")
                      if classname in expected:
                          seen.add(classname)
                      if case.find("failure") is not None or case.find("error") is not None:
                          errors.append(f"Failed test: {classname}#{method}")
                      skipped = case.find("skipped")
                      if skipped is not None:
                          reason = skipped.get("message", "") + " " + "".join(skipped.itertext())
                          allowed_reason = allowed_skips.get((classname, method))
                          if classname in expected or not allowed_reason or allowed_reason not in reason:
                              errors.append(f"Unexpected skip: {classname}#{method}: {reason}")
          errors.extend(f"Missing integration report: {name}" for name in sorted(expected - seen))
          print(f"Integration reports: {len(seen & expected)}/{len(expected)} classes; {len(reports)} total reports")
          if errors:
              raise SystemExit("\n".join(errors))

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-and-fixture-logs
          path: |
            target/surefire-reports/
            target/quack-fixture-logs/**/*.log

  publish:
    name: Publish to Maven Central
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17 with Central credentials
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy -DskipTests

  github-release:
    name: Attach jars to GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package versioned + sources + javadoc jars
        run: mvn --batch-mode --no-transfer-progress -Prelease package -DskipTests

      - name: Derive version and copy un-versioned jars
        id: artifacts
        run: |
          set -euo pipefail
          VERSION=$(mvn --batch-mode --no-transfer-progress \
                       -q -Dexec.executable=echo -Dexec.args='${project.version}' \
                       --non-recursive exec:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc-${VERSION}.jar"
          cp "target/quack-jdbc-${VERSION}.jar"          "release/quack-jdbc.jar"
          if [ -f "target/quack-jdbc-${VERSION}-sources.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-${VERSION}-sources.jar"
            cp "target/quack-jdbc-${VERSION}-sources.jar"  "release/quack-jdbc-sources.jar"
          fi
          if [ -f "target/quack-jdbc-${VERSION}-javadoc.jar" ]; then
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-${VERSION}-javadoc.jar"
            cp "target/quack-jdbc-${VERSION}-javadoc.jar"  "release/quack-jdbc-javadoc.jar"
          fi
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Strip the leading 'v' from the tag (refs/tags/v1.2.3 -> 1.2.3)
          # and pull the matching "## [VERSION] ..." section out of
          # CHANGELOG.md (stop at the next "## [" heading). Save to
          # release_notes.md; fall back to auto-generated notes if the
          # section is missing so the release still gets created.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version: ${VERSION}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "---- release_notes.md ----"
            cat release_notes.md
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: no matching CHANGELOG section for ${VERSION}; release will use auto-generated notes."
          fi

      - name: Create / update GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.have_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.have_notes != 'true' }}
          files: |
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}.jar
            release/quack-jdbc.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-sources.jar
            release/quack-jdbc-sources.jar
            release/quack-jdbc-${{ steps.artifacts.outputs.version }}-javadoc.jar
            release/quack-jdbc-javadoc.jar
            release/SHA256SUMS
          fail_on_unmatched_files: false
